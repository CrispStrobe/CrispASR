name: Dia CUDA validation bundle

on:
  workflow_dispatch:
  push:
    branches: [prepare/dia-cuda-20261013, prepare/dia-rope-cuda-20261013]
    paths:
      - '.github/workflows/dia-cuda-speech-validation.yml'
      - 'tools/ci-heavy/dia_cuda_bundle.py'
      - 'src/dia_tts.cpp'
      - 'src/dia_sampling.h'
      - 'src/dia_exponential_rng.h'
      - 'src/crispasr_c_api.cpp'
      - 'examples/cli/crispasr_backend_dia.cpp'

permissions:
  contents: read

concurrency:
  group: dia-cuda-speech-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Check exact runtime source guards
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 tests/test_dia_cuda_bundle.py -v
          python3 tests/test_dia_diff_device.py -v
          python3 tests/test_dia_dump_step.py -v
          python3 tests/test_dia_rotary_dispatch.py -v
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache patchelf
      - uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.4.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cudart-dev", "nvrtc", "nvrtc-dev"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'
      - uses: actions/cache/restore@v4
        id: ccache
        with:
          path: ~/.cache/ccache
          key: dia-cuda124-${{ runner.os }}-${{ github.sha }}
          restore-keys: dia-cuda124-${{ runner.os }}-
      - name: Build targeted CUDA proof and package runtime
        run: python3 tools/ci-heavy/dia_cuda_bundle.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dia-cuda-speech-validation-${{ github.sha }}
          path: dia-cuda-out/
          if-no-files-found: error
          retention-days: 14
