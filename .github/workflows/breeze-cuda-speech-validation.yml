name: Breeze CUDA validation bundle

on:
  workflow_dispatch:
  push:
    branches: [fix/breeze-validated-integration]
    paths:
      - '.github/workflows/breeze-cuda-speech-validation.yml'
      - 'tools/ci-heavy/breeze_cuda_bundle.py'
      - 'src/breeze_tts_2.cpp'
      - 'src/breeze_tts_2.h'
      - 'src/crispasr_c_api.cpp'
      - 'examples/cli/crispasr_backend_bt2_tts.cpp'

permissions:
  contents: read

concurrency:
  group: breeze-cuda-speech-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache patchelf
      - uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.4.1'
          method: network
          sub-packages: '["nvcc", "cudart", "cudart-dev", "nvrtc", "nvrtc-dev"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'
      - uses: actions/cache/restore@v4
        id: ccache
        with:
          path: ~/.cache/ccache
          key: breeze-cuda124-${{ runner.os }}-${{ github.sha }}
          restore-keys: breeze-cuda124-${{ runner.os }}-
      - name: Build targeted CUDA proof and package runtime
        run: python3 tools/ci-heavy/breeze_cuda_bundle.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breeze-cuda-speech-validation-${{ github.sha }}
          path: breeze-cuda-out/
          if-no-files-found: error
          retention-days: 14
