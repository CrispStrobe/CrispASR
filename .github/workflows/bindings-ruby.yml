name: Bindings Tests (Ruby)

# The gem vendors and compiles the whole C/C++ tree (bindings/ruby/
# extsources.rb), so the filter is the native tree plus the binding itself;
# it used to run on every push and PR, docs included.
on:
  push:
    branches:
      - main
    paths:
      - 'bindings/ruby/**'
      - 'src/**'
      - 'include/**'
      - 'examples/**'
      - 'ggml'
      - 'ggml/**'
      - '.gitmodules'
      - 'glint/**'
      - 'third_party/**'
      - 'crisp_*/**'
      - 'cmake/**'
      - '**/CMakeLists.txt'
      - 'CMakePresets.json'
      - 'samples/**'
      - 'tools/sync_ruby_context_guards.py'
      - '.github/workflows/bindings-ruby.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'bindings/ruby/**'
      - 'src/**'
      - 'include/**'
      - 'examples/**'
      - 'ggml'
      - 'ggml/**'
      - '.gitmodules'
      - 'glint/**'
      - 'third_party/**'
      - 'crisp_*/**'
      - 'cmake/**'
      - '**/CMakeLists.txt'
      - 'CMakePresets.json'
      - 'samples/**'
      - 'tools/sync_ruby_context_guards.py'
      - '.github/workflows/bindings-ruby.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ubuntu-22:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: bindings/ruby
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache whisper models
        uses: actions/cache@v4
        with:
          path: ~/.cache/crispasr
          key: ruby-whisper-models-base-en

      - name: Pre-download model (with retry)
        run: |
          mkdir -p ~/.cache/crispasr/huggingface.co/ggerganov/whisper.cpp/resolve/main
          MODEL=~/.cache/crispasr/huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          if [ ! -f "$MODEL" ] || [ $(wc -c < "$MODEL") -lt 1000000 ]; then
            for i in 1 2 3; do
              curl -L --retry 3 --retry-delay 10 -o "$MODEL" \
                https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin && break
              sleep 15
            done
          fi

      - run: rake test
