name: issue579 Ultra interface focused unit tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build and run C++ aligner tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DCRISPASR_BUILD_TESTS=ON
          cmake --build build --target test-align-only -j 2
          build/bin/test-align-only '[unit][align]'
      - name: Python binding controls
        run: |
          python3 -m pip install numpy pytest
          PYTHONPATH=python python3 -m pytest -q tests/test_python_binding_utils.py
