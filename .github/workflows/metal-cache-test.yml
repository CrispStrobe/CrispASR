name: issue579 RE-USE STFT reference
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install CPU PyTorch
        run: python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Capture reference features
        run: python3 tools/ci-heavy/issue579_reuse/stft_reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: reuse-stft-reference
          path: reuse-stft-reference-f32le.bin
