name: Recover 0.8.45 MUSA image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: recover-musa-0845
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.8.45
          submodules: recursive
      - name: Verify the original release source
        run: |
          test "$(git rev-parse HEAD)" = e58bb48b52cf1fe957c19586297c83a2ed0d9fe4
          test "$(cat VERSION)" = 0.8.45
      - name: Checkout pinned packaging recipe
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          path: .musa-qa
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: .devops/main-musa.Dockerfile
      - name: Free hosted disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build original runtime with the repaired dependency packaging
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .musa-qa/.devops/main-musa.Dockerfile
          load: true
          push: false
          tags: crispasr-musa-0845-verified
          build-args: CRISPASR_BUILD_JOBS=2
          labels: |
            org.opencontainers.image.revision=e58bb48b52cf1fe957c19586297c83a2ed0d9fe4
            org.opencontainers.image.version=0.8.45
            org.crispasr.musa.validation=compile-and-package-only
            org.crispasr.mualg.revision=e189e81f545694cfc79db7d216a049637235d176
      - name: Verify runtime entrypoint and exact notices without GPU inference
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash crispasr-musa-0845-verified -c '
            test -x /app/build/bin/crispasr
            bash -n /app/.devops/run-server.sh
            test -s /app/LICENSE && test -s /app/THIRD_PARTY_NOTICES.txt
            printf "%s  %s\n" 2ac06c9d4c058c9159e16ee8a83b41e3a403cf690fde725e664c2595e5f425a8 /app/THIRD_PARTY_LICENSES/muAlg-LICENSE.txt | sha256sum -c -
          '
          docker image inspect crispasr-musa-0845-verified > image.json
      - name: Verify runtime dependency closure
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /usr/bin/ldd crispasr-musa-0845-verified /app/build/bin/crispasr > dependencies.txt
          cat dependencies.txt
          python - <<'PY'
          from pathlib import Path
          missing = [line.strip().split()[0] for line in Path('dependencies.txt').read_text().splitlines() if 'not found' in line]
          unexpected = [name for name in missing if not name.startswith('libmusa.so')]
          assert not unexpected, unexpected
          print('Host-provided MUSA driver dependencies:', missing)
          print('No GPU inference or hardware acceptance is claimed by this packaging check.')
          PY
      - name: Publish only the recovered MUSA flavour
        run: |
          set -euo pipefail
          image=ghcr.io/crispstrobe/crispasr
          commit=e58bb48b52cf1fe957c19586297c83a2ed0d9fe4
          docker tag crispasr-musa-0845-verified "$image:main-musa-$commit"
          docker push "$image:main-musa-$commit"
          docker tag crispasr-musa-0845-verified "$image:main-musa"
          docker push "$image:main-musa"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: musa-0845-publication
          path: |
            image.json
            dependencies.txt
