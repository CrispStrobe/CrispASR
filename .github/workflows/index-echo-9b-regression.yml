name: Index Echo 9B large CPU regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/index_echo*'
      - 'src/crisp_audio*'
      - 'src/crispasr.cpp'
      - 'examples/cli/crispasr_backend_index_echo.cpp'
      - 'models/convert-index-echo-to-gguf.py'
      - 'tools/reference_backends/index_echo.py'
      - 'tools/ci-heavy/index_echo_validate.py'
      - 'tools/ci-heavy/index_echo_pipeline_check.py'
      - 'tools/ci-heavy/index_echo_roundtrip.py'
      - 'tools/index_echo_9b_acceptance.py'
      - '.github/workflows/index-echo-9b-regression.yml'
  schedule:
    - cron: '40 4 * * 0'

permissions:
  contents: read
  actions: read

concurrency:
  group: index-echo-9b-large-regression
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/heavy-cpu.yml
    secrets: inherit
    with:
      script: tools/ci-heavy/index_echo_validate.py
      runner: ubuntu-24.04-arm
      args: >-
        --size 9b --cohorts f16 --fixture-prefix index-echo-9b-f32-generation
        --reference-subdir reference-f32 --pipeline
        --pipeline-fixture-prefix index-echo-9b-f32-zh-context
        --pipeline-audio-path index-echo-9b/pipeline-zh-context/audio.wav --roundtrips --regression
      pip: huggingface_hub gguf numpy
      timeout_minutes: '180'
      validation_group: index-echo-9b
