# Does selecting ggml's CPU repack extra buffer type make quantised matmul
# faster, and on which ISAs? Closes item 1 of
# docs/ggml-optimisation-playbook.md §8. Full write-up:
# docs/ggml-repack-buft-evaluation.md.
#
# WHY THIS RUNS ON CI RATHER THAN THE DEV VPS. The VPS is a 4-vCPU shared box
# that has carried a load average of 6 to 40 all night. Interleaving the arms
# controls for *some* of that, but not for memory pressure or cache thrash, and
# no amount of repetition rescues a timing number from a ten-times
# oversubscribed machine. BASIC_PITCH_CONV_PERF.md makes exactly this contrast:
# a threading win invisible on the VPS measured 3.6-3.8x on a clean runner.
#
# The other reason is ISA coverage, which is the real variable here:
#
#   * The VPS is Skylake-SP  — AVX-512F/DQ/CD/BW/VL, NO VNNI, NO AMX.
#   * A Kaggle CPU worker    — AVX2 only, NO AVX-512, NO VNNI, NO AMX.
#   * GitHub ubuntu-24.04 x64 is Ice Lake / Cascade Lake class and MAY have
#     AVX-512 VNNI — the int8 dot-product instruction neither other machine
#     has, and the one ggml's repacked kernels can use where present.
#   * GitHub macos-14 is arm64 with dotprod and i8mm, where ggml's repack type
#     table INVERTS: q8_0 gets a kernel there and q4_K's AVX2 one does not
#     apply. Since every quantised GGUF in this tree is q8_0, the arm64 answer
#     is the one that decides whether this lever helps a phone build.
#
# So the first thing every leg prints is the ISA it actually got. A number
# without its machine is worthless, and a negative on one ISA says nothing
# about another.
#
# workflow_dispatch is deliberate: CrispASR CI runs get cancelled by
# concurrency-group supersession when other sessions push, and a superseded
# perf run is worse than no perf run because it looks like a failure.
name: ggml repack buft A/B

on:
  workflow_dispatch:
    inputs:
      end_to_end:
        description: "Also build the CLI and re-measure hFT / O&F on a clean runner"
        type: boolean
        default: false
  push:
    paths:
      - .github/workflows/ggml-repack-buft-ab.yml
      - examples/cli/crispasr_repack_probe.cpp
      - src/core/gguf_loader.cpp

jobs:
  ab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
          - { os: macos-14,         name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Host ISA — report this with every number below
        run: |
          echo "runner: ${{ matrix.os }} (${{ matrix.name }})  arch=$RUNNER_ARCH"
          echo "nproc : $(getconf _NPROCESSORS_ONLN)"
          if [ "$RUNNER_OS" = "Linux" ]; then
            grep -m1 'model name' /proc/cpuinfo || true
            echo "--- the flags that decide this question ---"
            for f in avx2 avx512f avx512vl avx512bw avx512_vnni avx_vnni amx_int8 \
                     asimddp i8mm sve; do
              if grep -qw "$f" /proc/cpuinfo; then echo "  $f = 1"; else echo "  $f = 0"; fi
            done
            uptime
            free -g || true
          else
            sysctl -n machdep.cpu.brand_string || true
            sysctl -a 2>/dev/null | grep -E 'hw.optional.(arm64|arm.FEAT_DotProd|arm.FEAT_I8MM)' || true
            sysctl -n vm.loadavg
          fi

      # Only ggml and the probe, not the whole tree — the probe links ggml
      # directly for exactly this reason. GGML_NATIVE=ON so the runner's own
      # ISA is used, which is the point.
      - name: Build ggml + probe
        run: |
          set -e
          cmake -S ggml -B bld -DCMAKE_BUILD_TYPE=Release \
                -DGGML_NATIVE=ON -DGGML_CPU_REPACK=ON \
                -DGGML_BUILD_TESTS=OFF -DGGML_BUILD_EXAMPLES=OFF
          cmake --build bld --target ggml ggml-base ggml-cpu -j "$(getconf _NPROCESSORS_ONLN)"
          LIBDIR=$(dirname "$(find bld -name 'libggml-cpu.*' | head -1)")
          echo "LIBDIR=$LIBDIR" >> "$GITHUB_ENV"
          # GGML_MAX_NAME must match the library's, because ggml_tensor::extra
          # sits immediately after name[GGML_MAX_NAME]. Compiling the probe with
          # a different value reads extra at the wrong offset and silently
          # reports "no repack kernel" for every tensor. This standalone ggml
          # build takes the header default; read it rather than hard-coding it.
          MAXNAME=$(sed -n 's/^#[[:space:]]*define[[:space:]]*GGML_MAX_NAME[[:space:]]*\([0-9]*\).*/\1/p' ggml/include/ggml.h | head -1)
          echo "GGML_MAX_NAME=$MAXNAME"
          c++ -O2 -std=c++17 -DGGML_MAX_NAME="$MAXNAME" \
              -I ggml/include examples/cli/crispasr_repack_probe.cpp \
              -o repack-probe -L "$LIBDIR" -lggml -lggml-base -lggml-cpu \
              -Wl,-rpath,"$PWD/$LIBDIR"
          ls -l repack-probe

      # One arm per PROCESS, cold run discarded, median of >= 3 — the same
      # discipline basic-pitch-conv-ab.yml encodes, and for the same reasons: a
      # shared process warms caches across arms. (The probe's default in-process
      # interleave is the right tool on a *contended* box, where between-process
      # drift dominates. On a clean runner it is not.)
      #
      # `--arm ... ` prints one machine-readable ARM line per (type, shape),
      # with status `ok` or `declined`. `declined` means the repack buffer type
      # has no kernel for that type on this ISA — a result, not a skip.
      - name: A/B — separate process per arm
        env:
          MKL_NUM_THREADS: "1"          # CrispASR issue #453
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set -e
          NPROC=$(getconf _NPROCESSORS_ONLN)
          : > arms.txt
          for t in 1 "$NPROC"; do
            for arm in default repack; do
              for rep in 0 1 2 3; do
                out=$(./repack-probe --arm "$arm" --threads "$t" --reps 30 | grep '^ARM ')
                # rep 0 is cold: page faults on the weight buffer and a
                # first-touch of the repacked layout. Discard it.
                [ "$rep" = 0 ] || echo "$out" >> arms.txt
              done
            done
          done
          cat arms.txt

      # The paired in-process view as well, for the human-readable ratio table
      # and because it cross-checks the separate-process numbers.
      - name: A/B — interleaved, human-readable
        env:
          MKL_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
        run: |
          ./repack-probe --threads 1 --reps 40 | tee ab-t1.txt
          ./repack-probe --threads "$(getconf _NPROCESSORS_ONLN)" --reps 40 | tee ab-tN.txt

      # Median across the surviving reps, per (arm, type, shape, threads), and
      # the ratio. Awk rather than a script file so the workflow stays hermetic.
      - name: Ratios from the separate-process arms
        run: |
          sort -k2,2 -k3,3 -k4,4 -k5,5 -k6,6 -k7,7 arms.txt | awk '
            $10 == "ok" { key = $3" "$4" "$5" "$6" "$7; v[key" "$2][++n[key" "$2]] = $8 }
            $10 == "declined" { dec[$3" "$7] = 1 }
            END {
              printf "%-6s %-18s %-3s %10s %10s %8s\n", "type", "shape(K,N,M)", "thr", "default", "repack", "speedup"
              for (k in n) { split(k, p, " "); key = p[1]" "p[2]" "p[3]" "p[4]" "p[5]; arms[key] = 1 }
              for (key in arms) {
                nd = n[key" default"]; nr = n[key" repack"]
                if (!nd) continue
                asort_med(v[key" default"], nd); d = med
                if (nr) { asort_med(v[key" repack"], nr); r = med } else r = 0
                split(key, p, " ")
                if (r > 0) printf "%-6s %-18s %-3s %10.4f %10.4f %7.2fx\n", p[1], p[2]","p[3]","p[4], p[5], d, r, d/r
                else       printf "%-6s %-18s %-3s %10.4f %10s %8s\n", p[1], p[2]","p[3]","p[4], p[5], d, "-", "declined"
              }
            }
            function asort_med(a, cnt,   i, j, t) {
              for (i = 1; i <= cnt; i++) for (j = i+1; j <= cnt; j++) if (a[j] < a[i]) { t=a[i]; a[i]=a[j]; a[j]=t }
              med = a[int((cnt+1)/2)]
            }' | sort | tee ratios.txt

      # A probe that silently found no repack buffer type would otherwise pass
      # green and be read as "measured, no win". Make the distinction explicit.
      - name: Say which of the three outcomes this leg is
        run: |
          if grep -q 'extra buffer types offered: 0' ab-t1.txt || \
             grep -q 'no extra buffer type on this host' ab-t1.txt; then
            echo "::warning::NO repack buffer type offered on ${{ matrix.name }} — untestable here, not a negative result"
          elif grep -q 'repack [0-9.]*x' ab-t1.txt; then
            echo "repack buffer type present AND exercised on ${{ matrix.name }}"
          else
            echo "::warning::repack buffer type offered on ${{ matrix.name }} but DECLINED every type probed"
          fi
          echo "--- types with no kernel on this ISA ---"
          grep 'DECLINED' ab-t1.txt || echo "(none)"

      - uses: actions/upload-artifact@v4
        with:
          name: repack-ab-${{ matrix.name }}
          path: |
            ab-t1.txt
            ab-tN.txt
            arms.txt
            ratios.txt

  # ===========================================================================
  # End-to-end, on a clean runner. Optional: it builds the CLI, which the
  # hermetic job above deliberately does not.
  #
  # This exists because everything in docs/music-transcription/*_PERF.md was
  # measured on the dev VPS at a load average of 3-20 (and the box hit 40 the
  # night this was written), and the docs say so in writing. Until today those
  # numbers could not be re-taken anywhere: the GGUFs were Kaggle outputs
  # published nowhere a runner could reach. cstr/hft-transformer-GGUF and
  # cstr/onsets-and-frames-GGUF are now public and in the model registry, so a
  # runner can fetch them and the figures can be firmed up.
  #
  # Two questions in one run:
  #   1. Does routing hFT's q4_0 weights through the repack buffer type change
  #      whole-model CPU time? (CRISPASR_GGUF_REPACK=0 is the control.)
  #   2. What are hFT's and O&F's f32-vs-q8_0 costs on a machine at load ~0,
  #      against the VPS's 1.29x and 0.96x?
  # ===========================================================================
  end-to-end:
    if: inputs.end_to_end
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,     name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, name: linux-arm64 }
    runs-on: ${{ matrix.os }}
    name: end-to-end ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Host ISA
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          for f in avx2 avx512f avx512_vnni amx_int8 asimddp i8mm sve; do
            if grep -qw "$f" /proc/cpuinfo; then echo "  $f = 1"; else echo "  $f = 0"; fi
          done
          echo "nproc: $(nproc)"; uptime

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      # GGML_NATIVE=ON, unlike ci.yml: this job is measuring, not checking
      # portability, and the ISA is the variable under test.
      - name: Build CLI
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON \
                -DCRISPASR_BUILD_TESTS=OFF -DCRISPASR_BUILD_SERVER=OFF
          cmake --build build --target crispasr-cli -j "$(nproc)"

      - name: Fetch models
        run: |
          set -e
          mkdir -p m
          base_h=https://huggingface.co/cstr/hft-transformer-GGUF/resolve/main
          base_o=https://huggingface.co/cstr/onsets-and-frames-GGUF/resolve/main
          for q in f32 q8_0 q4_0; do
            curl -fsSL -o "m/hft-$q.gguf" "$base_h/hft-transformer-$q.gguf"
            curl -fsSL -o "m/oaf-$q.gguf" "$base_o/onsets-and-frames-$q.gguf" || \
              echo "::warning::onsets-and-frames-$q.gguf not fetched"
          done
          ls -l m

      # Arms interleaved round-robin with a rotating start order, every arm in
      # its own process, cold rep discarded. CPU seconds (user+sys), not wall:
      # wall on a 4-core runner conflates the thread-scaling question with the
      # quantisation one.
      - name: Interleaved A/B
        env:
          MKL_NUM_THREADS: "1"          # CrispASR issue #453
          OPENBLAS_NUM_THREADS: "1"
        run: |
          set -u
          WAV=samples/jfk.wav
          declare -a N=(hft-f32 hft-q8_0 hft-q4_0-generic hft-q4_0-repack oaf-f32 oaf-q8_0)
          declare -a M=(m/hft-f32.gguf m/hft-q8_0.gguf m/hft-q4_0.gguf m/hft-q4_0.gguf \
                        m/oaf-f32.gguf m/oaf-q8_0.gguf)
          declare -a R=(0 0 0 1 0 0)
          for i in "${!N[@]}"; do : > "${N[$i]}.times"; done
          for rep in 0 1 2 3; do
            k=$(( rep % ${#N[@]} ))
            order="$(seq $k $(( ${#N[@]} - 1 )); seq 0 $(( k - 1 )) 2>/dev/null || true)"
            for i in $order; do
              [ -f "${M[$i]}" ] || continue
              t=$( { /usr/bin/time -f "%U %S %e" env CRISPASR_GGUF_REPACK="${R[$i]}" \
                      ./build/bin/crispasr --piano -m "${M[$i]}" -t 1 -f "$WAV" \
                      > "${N[$i]}.notes" 2>"${N[$i]}.log"; } 2>&1 | tail -1 )
              # rep 0 is cold: page cache, first touch, dynamic loader.
              [ "$rep" = 0 ] || echo "$t" >> "${N[$i]}.times"
              echo "rep $rep ${N[$i]} user+sys+wall: $t"
            done
          done
          echo
          echo "== CPU seconds (user+sys), median of 3, load $(cut -d' ' -f1 /proc/loadavg) =="
          for n in "${N[@]}"; do
            [ -s "$n.times" ] || continue
            awk '{print $1+$2}' "$n.times" | sort -n | \
              awk -v n="$n" '{a[NR]=$1} END {printf "%-20s %7.2f cpu-s (n=%d)\n", n, a[int((NR+1)/2)], NR}'
          done
          echo
          echo "== did the repack arm actually take the fast path? =="
          grep -h 'repack buffer type' hft-q4_0-repack.log || \
            echo "NO -- the repack arm fell back; its number is a duplicate of the generic arm"
          echo "== and the control must NOT have =="
          grep -h 'repack buffer type' hft-q4_0-generic.log && \
            echo "::error::the control arm took the repack path; the A/B compared the wrong thing" || \
            echo "control clean"
          echo
          echo "== decoded-note parity between the repack and generic arms =="
          if diff -q hft-q4_0-repack.notes hft-q4_0-generic.notes; then
            echo "identical"
          else
            echo "::warning::repack and generic arms decoded different notes"
            diff hft-q4_0-repack.notes hft-q4_0-generic.notes | head -20
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: repack-e2e-${{ matrix.name }}
          path: |
            *.times
            *.notes
            *.log
