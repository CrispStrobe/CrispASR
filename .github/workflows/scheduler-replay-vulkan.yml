name: Scheduler replay Vulkan regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ggml
      - tests/test-ggml-scheduler-replay.cpp
      - tools/ci-heavy/scheduler-replay/**
      - .github/workflows/scheduler-replay-vulkan.yml
  pull_request:
    paths:
      - ggml
      - tests/test-ggml-scheduler-replay.cpp
      - tools/ci-heavy/scheduler-replay/**
      - .github/workflows/scheduler-replay-vulkan.yml

# PRs: a newer push to the same PR cancels the older run. main pushes and
# manual runs get their own group (run_id), so they are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lavapipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GGML_VK_VISIBLE_DEVICES: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Check resources and install Vulkan dependencies
        run: |
          uptime
          free -h
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan-dev glslc spirv-headers mesa-vulkan-drivers vulkan-tools
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
          VK_ICD_FILENAMES="$icd" vulkaninfo --summary
      - name: Build focused regression against pinned ggml
        run: |
          cmake -S tools/ci-heavy/scheduler-replay -B build-replay -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=ON -DGGML_NATIVE=OFF
          cmake --build build-replay --target scheduler-replay -j2
      - name: Positive control with actual Vulkan execution
        run: |
          set -o pipefail
          build-replay/scheduler-replay 2>&1 | tee scheduler-positive.log
          grep -q SCHEDULER_REPLAY_VULKAN_PASS scheduler-positive.log
      - name: Negative control removes cached source reapplication
        run: |
          cp ggml/src/ggml-backend.cpp "$RUNNER_TEMP/scheduler-original.cpp"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ggml/src/ggml-backend.cpp')
          s = p.read_text()
          needle = '    ggml_backend_sched_apply_src_mutations(sched);'
          assert s.count(needle) == 1
          p.write_text(s.replace(needle, '    // Regression negative control: do not reapply cached sources.'))
          PY
          cmake --build build-replay --target scheduler-replay -j2
          set +e
          build-replay/scheduler-replay > scheduler-negative.log 2>&1
          status=$?
          set -e
          cat scheduler-negative.log
          test "$status" -ne 0
          grep -q 'compute reverse=0 iteration=1' scheduler-negative.log
          if grep -q SCHEDULER_REPLAY_VULKAN_PASS scheduler-negative.log; then exit 1; fi
          echo "SCHEDULER_NEGATIVE_CONTROL_REJECTED status=$status"
      - name: Negative control reproduces PR 480 unconditional disposal
        run: |
          cp "$RUNNER_TEMP/scheduler-original.cpp" ggml/src/ggml-backend.cpp
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ggml/src/ggml-backend.cpp')
          s = p.read_text()
          needle = ('    if (sched->src_mutations_applied) {\n'
                    '        ggml_backend_sched_restore_src_mutations(sched);\n'
                    '    }\n')
          assert s.count(needle) == 1
          p.write_text(s.replace(needle, '    ggml_backend_sched_restore_src_mutations(sched);\n'))
          PY
          cmake --build build-replay --target scheduler-replay -j2
          set +e
          build-replay/scheduler-replay > scheduler-disposal-negative.log 2>&1
          status=$?
          set -e
          cat scheduler-disposal-negative.log
          test "$status" -ne 0
          grep -q 'FAIL: reset must not overwrite recycled metadata' scheduler-disposal-negative.log
          echo "SCHEDULER_PR480_DISPOSAL_REJECTED status=$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-replay-vulkan-proof
          path: scheduler-*.log
