# Per-backend regression suite. See tests/regression/README.md for the
# full design rationale. Highlights:
#
#   - Nightly cron (04:00 UTC) + workflow_dispatch.
#   - Matrix per backend with fail-fast: false so one regression
#     surfaces all the others on the same run.
#   - Downloads pinned-revision GGUFs + pinned-revision reference dumps
#     from HuggingFace; never relies on `main` HEAD. This protects us
#     from upstream re-quantise / re-dump drift (the ggml-assertion-
#     hardening lesson).
#   - Per-job disk: 14 GB on ubuntu-latest, plenty for one ASR backend
#     at a time. Cleanup at the end is a belt-and-braces — the runner
#     is discarded anyway.
#   - HF cache lives under $RUNNER_TEMP so it's automatically gone at
#     the end of the job; no GitHub cache eviction concerns.
#
# Three tiers of tests (all run on GH free tier):
#
#   Tier 0 — smoke (no network, no model, <2 s):
#     manifest schema validation + driver unit tests
#     also: fast Python unit tests (backend_config, driver_smoke)
#
#   Tier 0.5 — unit-tests (no network, no model, <10 s):
#     all no-model Python tests in tests/ (test_backend_config.py, etc.)
#
#   Tier 1 — preflight dry-run (HF API, no download, ~5 s):
#     HEAD-check every pinned HF artifact referenced by manifest.json
#
#   Tier 2 — per-backend regression (nightly only):
#     full build + download + crispasr + crispasr-diff against pinned refs
#     entries with skip_diff=true run transcript check only (no ref dump
#     needed); useful while the Kaggle rebake for a new backend is pending

name: Regression (nightly)

on:
  schedule:
    - cron: '0 4 * * *'  # 04:00 UTC daily
  workflow_dispatch:
    inputs:
      granite5_only:
        description: 'Run the complete published Granite5 acceptance regression only'
        type: boolean
        default: false
      diagnostic_backend:
        description: 'Single-backend diagnostics; none keeps normal selection'
        type: choice
        options: [none, csm-1b, data2vec-base]
        default: none
  # PR / push: smoke + unit + preflight, plus the per-backend regression for
  # only the backends the change can affect (tools/regression_select.py; shared
  # code selects a small core set). Docs-only changes do not trigger it.
  pull_request:
    paths:
      - 'tests/regression/**'
      - 'tests/test_python_diarize_turns.py'
      - 'tests/test_python_audio_resample.py'
      - 'tests/test_python_helpers.py'
      - 'python/crispasr/**'
      - '.github/workflows/regression.yml'
      - 'src/**'
      - 'examples/cli/**'
      - 'models/**'
      - 'tests/test_phonon2_container.py'
      - 'CMakeLists.txt'
      - 'ggml'
      - 'tools/regression_select.py'
      - 'tools/ci-heavy/granite5*'
      - 'tests/test_granite5_regression.py'
      - 'tests/test_regression_diagnostics.py'
      - 'tests/test_data2vec_cpu_profiles.py'
      - 'tools/ci-heavy/data2vec_cpu_profiles.py'
      - 'tools/reference_backends/phonon2/**'
      - 'tools/reference_backends/parakeet_hf.py'
      - 'tools/reference_backends/index_echo.py'
      - 'tools/index_echo_acceptance.py'
      - 'tests/test_index_echo_acceptance.py'
      - 'tools/index_echo_9b_acceptance.py'
      - 'tests/test_index_echo_9b_acceptance.py'
  # Push to main: the backends the change can touch run right away instead of
  # waiting for the nightly - e.g. #470's legacy canary load break would have
  # shown on the push, not the next morning.
  push:
    branches: [main]
    paths:
      - 'python/crispasr/**'
      - 'tests/test_python_audio_resample.py'
      - 'tests/test_python_helpers.py'
      - 'src/**'
      - 'examples/cli/**'
      - 'models/**'
      - 'tests/test_phonon2_container.py'
      - 'CMakeLists.txt'
      - 'ggml'
      - 'tests/regression/**'
      - 'tools/regression_select.py'
      - 'tools/ci-heavy/granite5*'
      - 'tests/test_granite5_regression.py'
      - 'tests/test_regression_diagnostics.py'
      - 'tests/test_data2vec_cpu_profiles.py'
      - 'tools/ci-heavy/data2vec_cpu_profiles.py'
      - 'tools/reference_backends/phonon2/**'
      - 'tools/reference_backends/parakeet_hf.py'
      - 'tools/reference_backends/index_echo.py'
      - 'tools/index_echo_acceptance.py'
      - 'tests/test_index_echo_acceptance.py'
      - 'tools/index_echo_9b_acceptance.py'
      - 'tests/test_index_echo_9b_acceptance.py'
      - '.github/workflows/regression.yml'

permissions:
  contents: read

concurrency:
  # event_name in the key: a push to main must never cancel the nightly run
  # (same ref), and vice versa. Consecutive pushes still supersede each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tier 0: schema + parser smoke test. Runs in <2 seconds with no
  # binary, no model, no network — so the per-backend matrix below
  # never even spawns if the manifest is malformed.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Run driver smoke test
        run: python tests/regression/test_driver_smoke.py

  # Tier 0.5: no-model Python unit tests. Validates backend config
  # invariants and other source-level assertions that don't require a
  # built binary or a model download. Runs in <10 s.
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # tests/test_python_chat.py imports python/crispasr/_binding.py, which
      # imports numpy at module scope — without it those cases ERROR rather than
      # skip, and unittest's non-zero exit fails the step. The job never got
      # this far before (the step above was red), so the gap was invisible. The
      # perf job below already does exactly this on line ~275.
      - name: Install no-model test deps
        # Granite Q4 inventory controls write tiny synthetic GGUF fixtures.
        run: pip install -q numpy 'gguf==0.17.1'
      - name: Run no-model Python unit tests
        run: |
          python -m pytest tests/test_backend_config.py -v || \
          python -m unittest tests/test_backend_config.py -v
      - name: Phonon-2 container format tests
        run: python -m unittest discover -s tests -p test_phonon2_container.py -v
      - name: Index-Echo numerical acceptance bounds
        run: python -m unittest discover -s tests -p 'test_index_echo*acceptance.py' -v
      - name: Granite5 immutable regression input controls
        run: python -m unittest discover -s tests -p 'test_granite5_*.py' -v
      # Chat binding (#362). 891 lines of tests that nothing invoked: this file
      # is not named by any workflow and regression.yml pytests two files by
      # name rather than a directory, so it could only ever run by hand. With
      # neither a library nor a model it still exercises the ctypes ABI struct
      # definitions, the param defaults and the UTF-8 chunk assembly — 5 cases
      # — and skips the rest, so it is safe in a job that builds nothing.
      - name: Run no-model Python chat-binding tests
        run: |
          python -m pytest tests/test_python_chat.py -v || \
          python -m unittest tests/test_python_chat.py -v
      - name: Run Python constructor helper discovery tests
        run: python -m unittest discover -s tests -p test_python_helpers.py -v
      - name: Run Python array resampling and native ABI tests
        run: python -m unittest discover -s tests -p test_python_audio_resample.py -v
      - name: Run Python diarization ABI tests
        run: |
          python -m pytest tests/test_python_diarize_turns.py -v || \
          python tests/test_python_diarize_turns.py -v
      # Perf-regression compare logic (docs/perf-sweep/PLAN.md TODO-4). Model-free —
      # guards the hard/soft-gate logic used by the nightly perf snapshot step below.
      # Regression matrix picker: nightly list vs manifest, per-file selection.
      - name: Run regression-select unit tests
        run: |
          python -m pytest tests/test_regression_select.py -v || \
          python tests/test_regression_select.py -v
      - name: Run model-free failure diagnostics controls
        run: python -m unittest discover -s tests -p test_regression_diagnostics.py -v
      - name: Run data2vec worker hardware preflight controls
        run: python tests/test_data2vec_cpu_profiles.py -v
      - name: Run CSM metadata and capture guards
        run: |
          python tests/test_csm_rope_metadata.py -v
          python tests/test_csm_prefill_capture.py -v
      - name: Run perf-baseline compare unit tests
        run: |
          python tools/perf_baseline_compare.py --selftest
          python -m pytest tests/test_perf_baseline_compare.py -v || \
          python tests/test_perf_baseline_compare.py -v

  # Which backends this run tests: nightly/dispatch = the full list in
  # tests/regression/nightly_matrix.json; push/PR = the subset the changed
  # files can affect (empty -> the regression job is skipped).
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      granite5: ${{ steps.pick.outputs.granite5 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GH_TOKEN: ${{ github.token }}
          GRANITE5_ONLY: ${{ inputs.granite5_only }}
          DIAGNOSTIC_BACKEND: ${{ inputs.diagnostic_backend }}
        run: |
          case "$DIAGNOSTIC_BACKEND" in
            ''|none) ;;
            csm-1b|data2vec-base)
              if [ "$GRANITE5_ONLY" = true ]; then
                echo '::error::diagnostic_backend and granite5_only cannot both be set'
                exit 1
              fi
              printf 'matrix=["%s"]\n' "$DIAGNOSTIC_BACKEND" >> "$GITHUB_OUTPUT"
              echo 'granite5=false' >> "$GITHUB_OUTPUT"
              echo "selected diagnostic backend: $DIAGNOSTIC_BACKEND"
              exit 0
              ;;
            *) echo '::error::diagnostic_backend must be none, csm-1b, or data2vec-base'; exit 1 ;;
          esac
          if [ "$GRANITE5_ONLY" = true ]; then
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            echo 'granite5=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Push: diff against the head of the newest SUCCESSFUL push Regression run
          # on main that is an ancestor of this commit, not just the previous
          # push. Consecutive pushes cancel each other (concurrency), and a
          # cancelled run's changes were otherwise never selected again: on
          # 2026-09-28 the parakeet + wav2vec2 fixes landed in cancelled runs and
          # the surviving run selected only the diff-tool change.
          # Only automatic push runs advance this baseline. Manual Granite-only
          # and single-backend diagnostic runs never qualify the core-model matrix.
          if [ "$EVENT" = push ]; then
            for sha in $(gh run list -R "$GITHUB_REPOSITORY" --workflow regression.yml --branch main \
                           --event push --status success --limit 30 --json headSha --jq '.[].headSha' 2>/dev/null); do
              if git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then BASE="$sha"; break; fi
            done
          fi
          echo "base: $BASE"
          m=$(python3 tools/regression_select.py --event "$EVENT" --base "$BASE" --head HEAD)
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          granite5=$(python3 tools/regression_select.py --granite5 --event "$EVENT" --base "$BASE" --head HEAD)
          echo "granite5=$granite5" >> "$GITHUB_OUTPUT"
          echo "selected: $m"

  # Dry-run preflight: confirm every pinned HF artifact in the
  # manifest actually exists (GGUF + fixture ref.gguf + fixture
  # audio.wav). Entries with skip_diff=true skip the ref.gguf check.
  # Catches the "added a backend, forgot to upload" case in PR CI
  # without the 1+ GB pull. ~1 s for the seed manifest; O(N+1) HF
  # API calls for N backends.
  preflight:
    # Granite-only replay checks its own immutable model/reference inputs.
    if: inputs.granite5_only != true
    needs: [smoke, unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: pip install huggingface_hub
      - run: python tests/regression/run_one.py --dry-run
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  # Tier 2: per-backend regression. Each entry of the matrix downloads
  # its pinned-revision GGUF + pinned-revision reference dump from HF,
  # runs crispasr + crispasr-diff against the manifest's expected
  # transcript and per-stage cos_min thresholds. `fail-fast: false`
  # so one bad backend doesn't mask the rest.
  #
  # Backends with skip_diff=true in manifest.json run only the
  # transcript check (no ref.gguf download, no crispasr-diff). Add
  # new backends with skip_diff=true to get transcript regression
  # on GH immediately; graduate them to full diff entries once the
  # Kaggle rebake lands in cstr/crispasr-regression-fixtures.
  #
  # Nightly / dispatch run every backend in tests/regression/nightly_matrix.json;
  # push / PR run only the affected subset chosen by the `select` job.
  # (Previously skipped on `pull_request` — PRs only got smoke + unit-tests +
  # preflight, which run in <5 minutes total. Full matrix runs
  # nightly + on manual workflow_dispatch.
  #
  # The matrix is intentionally small; expand as backends get their
  # fixtures uploaded to HF (see `tests/regression/README.md`
  # "Adding a new backend"). Heavy backends (vibevoice 7 GB,
  # voxtral4b 4 GB) that don't fit reliably on the GitHub free-tier
  # 14 GB ubuntu-latest scratch should go through the weekly Kaggle
  # full-sweep job (`tools/test-all-backends.py` on a Kaggle kernel) instead.
  granite5:
    needs: [smoke, unit-tests, select]
    if: needs.select.outputs.granite5 == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DOWNLOAD_TIMEOUT: '120'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install hosted CPU dependencies
        run: |
          bash tools/ci-apt.sh update
          bash tools/ci-apt.sh install -y ninja-build libopenblas-dev
          python -m pip install 'numpy<3' 'gguf==0.17.1' 'huggingface_hub>=0.36,<2'
      - name: Build public CPU surfaces and stage probe
        run: |
          uptime
          free -m
          python - <<'PY'
          import os
          from pathlib import Path
          available = next(int(s.split()[1]) for s in Path('/proc/meminfo').read_text().splitlines()
                           if s.startswith('MemAvailable:'))
          assert available >= 6 * 1024 * 1024 and os.getloadavg()[0] <= 2 * os.cpu_count()
          PY
          cmake -S . -B build-granite5 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PROJECT_crispasr_INCLUDE="$PWD/tools/ci-heavy/granite5_regression_targets.cmake" \
            -DBUILD_SHARED_LIBS=ON -DCRISPASR_BUILD_TESTS=OFF -DCRISPASR_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF -DGGML_BLAS=OFF
          cmake --build build-granite5 --target crispasr-cli crispasr-lib granite5-stage-probe -j2
      - name: Replay all accepted CPU gates for published profiles
        run: |
          export HF_HOME="$RUNNER_TEMP/granite5-hf"
          python tools/ci-heavy/granite5_regression.py \
            --pins tests/regression/granite5.json --build-root build-granite5 \
            --scratch "${{ runner.temp }}/granite5-inputs" --out granite5-regression-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: granite5-regression
          path: granite5-regression-out/
          if-no-files-found: warn

  regression:
    # NOT `needs: preflight`: one transient HF/GitHub-storage error in the
    # preflight used to skip every backend (Sep 13, 15, 16, 17 tested nothing).
    # Preflight still runs and reports on its own; each backend job fails on
    # its own download if an artifact is really gone.
    needs: [smoke, unit-tests, select]
    if: needs.select.outputs.matrix != '[]' && needs.select.outputs.matrix != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # Full list: tests/regression/nightly_matrix.json (heavy backends go
        # through the Kaggle full sweep instead). Push/PR get the affected subset.
        backend: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build + runtime deps
        run: |
          bash tools/ci-apt.sh update
          # libespeak-ng-dev: provides espeak-ng/speak_lib.h + libespeak-ng.so
          # + espeak-ng-data, so CMake's `CRISPASR_WITH_ESPEAK_NG=AUTO` detects
          # the library and compiles kokoro with `CRISPASR_HAVE_ESPEAK_NG=1`.
          # The kokoro backend then calls `espeak_TextToPhonemes()` in-process
          # instead of shelling out to `popen("espeak-ng …")` — saves ~30–50 ms
          # per call and avoids the shell-quoting surface. The popen path
          # remains as a safety fallback if libespeak init fails at runtime,
          # so we also keep the `espeak-ng` binary installed for belt-and-
          # braces coverage. See src/kokoro.cpp `phonemize_espeak_lib` /
          # `phonemize_popen` and src/CMakeLists.txt `CRISPASR_WITH_ESPEAK_NG`.
          bash tools/ci-apt.sh install -y cmake g++ ninja-build libopenblas-dev jq \
              libespeak-ng-dev espeak-ng pkg-config
          # huggingface_hub for hf_hub_download; no transformers / nemo
          # needed on the CI side because reference dumps are pre-baked
          # and stored in HF, not regenerated.
          python -m pip install --upgrade pip
          pip install huggingface_hub numpy gguf
      - name: Authenticate HuggingFace (avoids 429 rate limit)
        if: env.HF_TOKEN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: huggingface-cli login --token "$HF_TOKEN" --add-to-git-credential 2>/dev/null || true

      - name: Configure + build crispasr-cli (+ crispasr-diff for full-diff backends)
        run: |
          cmake -S . -B build-regression -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
              -DCRISPASR_BUILD_TESTS=OFF \
              -DCRISPASR_BUILD_EXAMPLES=ON \
              -DCRISPASR_BUILD_SERVER=OFF
          # CMake target `crispasr-cli` produces the `bin/crispasr`
          # binary (target name vs output name diverge — see
          # examples/cli/CMakeLists.txt). Asking for target `crispasr-lib`
          # would build just the library, leaving bin/crispasr absent.
          #
          # Also build crispasr-diff unconditionally — the binary is
          # tiny and building it costs <10 s, much less than adding
          # conditional logic per matrix backend.
          cmake --build build-regression --target crispasr-cli crispasr-diff -j"$(nproc)"

      - name: Run regression for ${{ matrix.backend }}
        env:
          BUILD_DIR: build-regression
          WORK_DIR: ${{ runner.temp }}/regression-${{ matrix.backend }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_ENABLE_HF_TRANSFER: "0"
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
          REGRESSION_BACKEND: ${{ matrix.backend }}
          REGRESSION_DIAGNOSTICS_DIR: ${{ runner.temp }}/regression-diagnostics-${{ matrix.backend }}
          REGRESSION_KEEP_TTS_WAV: ${{ inputs.diagnostic_backend == 'csm-1b' && '1' || '0' }}
        run: |
          mkdir -p "$WORK_DIR"
          # Capture the real sampled path whenever CSM fails on a runner whose
          # ISA cannot be requested in advance. Each trace is bounded to2048
          # sampling records. Explicit manual CSM controls retain both outcomes.
          if [ "$REGRESSION_BACKEND" = csm-1b ]; then
            mkdir -p "$REGRESSION_DIAGNOSTICS_DIR"
            export CRISPASR_CSM_TRACE_PREFIX="$REGRESSION_DIAGNOSTICS_DIR/sampled"
          fi
          tests/regression/run_one.py "$REGRESSION_BACKEND"

      - name: Retain CSM/data2vec diagnostics and host/build evidence
        if: (failure() || inputs.diagnostic_backend == matrix.backend) && (matrix.backend == 'csm-1b' || matrix.backend == 'data2vec-base')
        env:
          REGRESSION_DIAGNOSTICS_DIR: ${{ runner.temp }}/regression-diagnostics-${{ matrix.backend }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          out = Path(os.environ['REGRESSION_DIAGNOSTICS_DIR'])
          out.mkdir(parents=True, exist_ok=True)
          (out / 'cpuinfo.txt').write_bytes(Path('/proc/cpuinfo').read_bytes()[:1024 * 1024])
          for name, cmd in {
              'cpu.txt': ['lscpu'],
              'memory.txt': ['free', '-m'],
              'load.txt': ['uptime'],
              'compiler.txt': ['c++', '--version'],
              'kernel.txt': ['uname', '-a'],
          }.items():
              result = subprocess.run(cmd, capture_output=True, timeout=15)
              (out / name).write_bytes((result.stdout + result.stderr)[:65536])
          for name, limit in [('compile_commands.json', 8 * 1024 * 1024),
                              ('CMakeCache.txt', 2 * 1024 * 1024)]:
              source = Path('build-regression') / name
              if source.is_file():
                  size = source.stat().st_size
                  if size <= limit:
                      (out / name).write_bytes(source.read_bytes())
                  else:
                      (out / f'{name}.skipped.txt').write_text(
                          f'{name} was {size} bytes, above {limit}-byte evidence cap\n')
          PY

      - uses: actions/upload-artifact@v4
        if: (failure() || inputs.diagnostic_backend == matrix.backend) && (matrix.backend == 'csm-1b' || matrix.backend == 'data2vec-base')
        with:
          name: regression-diagnostics-${{ matrix.backend }}
          path: ${{ runner.temp }}/regression-diagnostics-${{ matrix.backend }}/
          if-no-files-found: error
          retention-days: 7

      # F2: cross-surface (CLI vs session C-ABI) parity — best-effort guard
      # against the #257 dual-dispatch class. Parakeet only for now (the one
      # backend that historically diverged). Builds the shared lib for the
      # python session side and runs the harness against the model run_one.py
      # just fetched. continue-on-error + skip-guards mean it can never break
      # the regression job; it reports PASS/FAIL/SKIP for visibility.
      - name: Cross-surface parity (parakeet, best-effort)
        if: startsWith(matrix.backend, 'parakeet')
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cmake -S . -B build-shared -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=ON -DCRISPASR_BUILD_TESTS=OFF -DCRISPASR_BUILD_EXAMPLES=OFF || exit 0
          cmake --build build-shared --target crispasr-lib -j"$(nproc)" || exit 0
          pip install -q numpy || true
          model=$(find "${{ runner.temp }}/regression-${{ matrix.backend }}" ~/.cache/huggingface \
                   -name '*.gguf' 2>/dev/null | head -1)
          lib=$(find build-shared -name 'libcrispasr.so' | head -1)
          [ -n "$model" ] && [ -n "$lib" ] || { echo "SKIP: model/lib not found"; exit 0; }
          CRISPASR_BIN=build-regression/bin/crispasr CRISPASR_LIB_PATH="$lib" \
            CRISPASR_PARITY_BACKEND=parakeet CRISPASR_PARITY_MODEL="$model" \
            bash tests/test-surface-parity.sh || true

      - name: Free disk
        if: always()
        run: |
          # Belt-and-braces; the runner gets nuked anyway, but keep the
          # cleanup explicit so a `KEEP_WORK=1` local invocation doesn't
          # accidentally leak after porting.
          rm -rf "${{ runner.temp }}/regression-${{ matrix.backend }}" 2>/dev/null || true
          df -h /
