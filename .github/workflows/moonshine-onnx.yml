name: Moonshine ONNX and native stream acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/moonshine_onnx.*'
      - 'src/moonshine-tokenizer.*'
      - 'src/core/nemotron_text.h'
      - 'src/core/qwen3_stream*.h'
      - 'src/crispasr_c_api.cpp'
      - 'src/crispasr_model_registry.cpp'
      - 'src/CMakeLists.txt'
      - 'examples/cli/crispasr_backend_moonshine_onnx.cpp'
      - 'examples/cli/crispasr_model_mgr_cli.cpp'
      - 'src/nemotron.cpp'
      - 'src/qwen3_asr.cpp'
      - 'tests/regression/manifest.json'
      - 'tools/dump_reference.py'
      - 'examples/cli/crispasr_diff_main.cpp'
      - 'scripts/fetch_onnxruntime.sh'
      - 'tools/reference_backends/moonshine_onnx.py'
      - 'tools/ci-heavy/pr515_acceptance.py'
      - '.github/workflows/moonshine-onnx.yml'
  push:
    branches: [main]
    paths:
      - 'src/moonshine_onnx.*'
      - 'src/moonshine-tokenizer.*'
      - 'src/core/nemotron_text.h'
      - 'src/core/qwen3_stream*.h'
      - 'src/crispasr_c_api.cpp'
      - 'src/crispasr_model_registry.cpp'
      - 'src/CMakeLists.txt'
      - 'examples/cli/crispasr_backend_moonshine_onnx.cpp'
      - 'examples/cli/crispasr_model_mgr_cli.cpp'
      - 'src/nemotron.cpp'
      - 'src/qwen3_asr.cpp'
      - 'tests/regression/manifest.json'
      - 'tools/dump_reference.py'
      - 'examples/cli/crispasr_diff_main.cpp'
      - 'scripts/fetch_onnxruntime.sh'
      - 'tools/reference_backends/moonshine_onnx.py'
      - 'tools/ci-heavy/pr515_acceptance.py'
      - '.github/workflows/moonshine-onnx.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: moonshine-onnx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-acceptance:
    uses: ./.github/workflows/heavy-cpu.yml
    with:
      script: tools/ci-heavy/pr515_acceptance.py
      pip: numpy gguf huggingface_hub onnxruntime==1.30.0 tokenizers
      timeout_minutes: '120'
    secrets: inherit
