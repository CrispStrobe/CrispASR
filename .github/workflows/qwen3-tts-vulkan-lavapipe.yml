name: issue579 Ultra CPU parity
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build CLI
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCRISPASR_BUILD_TESTS=OFF
          cmake --build build --target crispasr-cli issue579-ultra-hidden-probe -j 2
          build/bin/issue579-ultra-hidden-probe
      - name: Install reference dependencies
        run: |
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install qwen-asr==0.0.6 gguf safetensors huggingface_hub
      - name: Fetch pinned Ultra model and convert
        run: |
          python3 - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download('17slever17/Qwen3-ForcedAligner-Ultra', revision='765dc1d714e4c80196782a5df5bfbcb3e1416736', local_dir='model', ignore_patterns=['*.md','*.png'])
          PY
          sha256sum model/model.safetensors
          python3 models/convert-qwen3-asr-to-gguf.py --input model --output qwen3-forced-aligner-ultra.gguf
          sha256sum qwen3-forced-aligner-ultra.gguf
      - name: Compare reference and CrispASR alignment
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python3 tools/ci-heavy/issue579_ultra_live.py
      - name: Capture upstream optional local-head reference
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python3 -m pip install --no-deps model/companion/dist/qwen_fa_ultra-0.1.1-py3-none-any.whl
          python3 tools/ci-heavy/issue579_ultra_local_reference.py
      - name: Compare opt-in hidden states with upstream
        env:
          GH_TOKEN: ${{ github.token }}
          OMP_NUM_THREADS: '2'
        run: |
          gh run download 42313568853 -n issue579-ultra-parity -D prior-reference
          cp prior-reference/local-head-stages.npz .
          build/bin/issue579-ultra-hidden-probe qwen3-forced-aligner-ultra.gguf samples/jfk.wav ultra-hidden.bin
          python3 tools/ci-heavy/issue579_ultra_hidden_compare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue579-ultra-parity
          path: |
            reference.json
            actual.json
            local-head-reference.json
            local-head-stages.npz
            ultra-hidden.bin
          if-no-files-found: ignore
