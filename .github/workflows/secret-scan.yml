# Fails when a tracked file contains a credential (tests/test_no_secrets.py).
# No paths filter on purpose: a token can land in any file, including docs.
# Background: three Kaggle API tokens sat in public tools/kaggle/* scripts from
# 2026-07 to 2026-09 and had to be revoked and scrubbed from history.
name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Push stays on EVERY branch on purpose (the one exception to "push: main
# only"): pushing a branch to this public repo publishes the token at that
# moment, PR or not. A same-repo pull_request would then scan the identical
# commit a second time, so the PR run is skipped unless the head lives in a
# fork (whose pushes never trigger this repository's workflows).
#
# Every run checks the whole tracked tree, so on a branch or PR a newer push
# supersedes (cancels) the older run. main pushes and manual runs get their
# own group (run_id) and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch' }}

jobs:
  scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: No credentials in tracked files
        env:
          # Only used to assert the account name is NOT in the repo.
          KAGGLE_ACCOUNT: ${{ secrets.KAGGLE_ACCOUNT }}
        run: python3 tests/test_no_secrets.py -v
