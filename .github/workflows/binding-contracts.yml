name: Binding ABI contracts
on:
  push:
    branches: [main]
    paths:
      - 'crispasr/**'
      - 'crispasr-sys/**'
      - 'bindings/**'
      - 'flutter/crispasr/**'
      - 'tests/test_*_wrapper_contract.py'
      - 'tests/fixtures/**'
      - 'tests/build_legacy_wrapper_probe.py'
      - 'src/crispasr_c_api.cpp'
      - 'tools/run-wrapper-contract.py'
      - 'tools/sync_ruby_context_guards.py'
      - 'include/crispasr*.h'
      - '.github/workflows/binding-contracts.yml'
  pull_request:
    paths:
      - 'crispasr/**'
      - 'crispasr-sys/**'
      - 'bindings/**'
      - 'flutter/crispasr/**'
      - 'tests/test_*_wrapper_contract.py'
      - 'tests/fixtures/**'
      - 'tests/build_legacy_wrapper_probe.py'
      - 'src/crispasr_c_api.cpp'
      - 'tools/run-wrapper-contract.py'
      - 'tools/sync_ruby_context_guards.py'
      - 'include/crispasr*.h'
      - '.github/workflows/binding-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, java, ruby, dart, wasm, go-rust]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        if: matrix.language == 'go-rust'
        with:
          go-version-file: bindings/go/go.mod
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'go-rust'
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '17'
      - name: Fetch pinned JNA dependency
        if: matrix.language == 'java'
        run: |
          curl --fail --retry 3 --location https://repo.maven.apache.org/maven2/net/java/dev/jna/jna/5.13.0/jna-5.13.0.jar --output "$RUNNER_TEMP/jna.jar"
          echo "CRISPASR_JNA_JAR=$RUNNER_TEMP/jna.jar" >> "$GITHUB_ENV"
      - uses: dart-lang/setup-dart@v1
        if: matrix.language == 'dart'
        with:
          sdk: '3.12.1'
      - uses: ruby/setup-ruby@v1
        if: matrix.language == 'ruby'
        with:
          ruby-version: '3.3'
      - uses: mymindstorm/setup-emsdk@v14
        if: matrix.language == 'wasm'
        with:
          version: '6.0.2'
          actions-cache-folder: emsdk-6.0.2
      - name: Locate required browser for pthread dispatch checks
        if: matrix.language == 'wasm'
        run: |
          browser_path="$(command -v google-chrome || command -v chromium)"
          test -x "$browser_path"
          "$browser_path" --version
          echo "CRISPASR_CHROME=$browser_path" >> "$GITHUB_ENV"
      - name: Compile and exercise actual wrapper adapters
        env:
          CRISPASR_GO_RACE: ${{ matrix.language == 'go-rust' && '1' || '0' }}
        run: python3 tools/run-wrapper-contract.py ${{ matrix.language }}
